  <div class="card">

    <p>Vincule sua conta do WhatsApp Business Management e conceda permissões de envio e gerenciamento de mensagens via infraestrutura oficial Meta Tech Provider.</p>

    <button class="btn-meta" onclick="launchWhatsAppSignup()">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="white" xmlns="http://www.w3.org/2000/svg">

      App: NEØ FLOW E-gine (ID: 1500002841696407) · Graph API v25.0
    </div>
  </div>

  <script>
    window.fbAsyncInit = function() {
      FB.init({
        appId      : '1500002841696407', // App ID do NEØ FLOW E-gine
        cookie     : true,
        xfbml      : true,
        version    : 'v25.0'
      });
    };

    function launchWhatsAppSignup() {
      const statusDiv = document.getElementById('signup-status');
      FB.login(function (response) {
        if (response.authResponse) {
          console.log('Código/Token capturado com sucesso:', response.authResponse);
          if (statusDiv) {
            statusDiv.style.display = 'block';
            statusDiv.innerHTML = '✓ Conexão realizada com sucesso! WABA vinculado.';
          }
          alert('Conexão realizada com sucesso! WABA vinculado.');
        } else {
          console.log('Login cancelado ou não autorizado.');
          if (statusDiv) {
            statusDiv.style.display = 'block';
            statusDiv.style.color = '#ff4d4d';
            statusDiv.innerText = '✕ Login cancelado ou não autorizado.';
          }
        }
      }, {
        /* Permissões exigidas pelo Tech Provider */
        scope: 'whatsapp_business_management,whatsapp_business_messaging,business_management',
        response_type: 'code'
      });
    }
  </script>
  <script async defer crossorigin="anonymous" src="https://connect.facebook.net/pt_BR/sdk.js"></script>
